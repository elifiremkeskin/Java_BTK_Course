spring.application.name=school

spring.datasource.url=jdbc:postgresql://localhost:5432/School
spring.datasource.username=postgres
spring.datasource.password=12345

spring.jpa.hibernate.ddl-auto=validate
#create yeni oluşturur riskli
#validate  kontrol eder yazdıkların datayla uyuşuyo mu yoksa hata verir
#update yeni eklediğini eskiyle karşılaştırır yoksa onu da sisteme ekler
#en iyisi updatete bırakmak
#alt taraf runda sql değişimlerini buradan görebilmek için eklenir
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
